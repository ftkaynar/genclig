name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check:all
    runs-on: ubuntu-latest
    env:
      # Build zamanı dummy değerler. Gerçek Supabase'e bağlanılmaz; amaç
      # env eksikliği yüzünden derlemenin patlamadığını doğrulamak değil,
      # Vercel'deki gibi env dolu haldeki derlemeyi sınamak.
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:all
